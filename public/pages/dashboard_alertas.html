<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogiDock - Alertas</title>

    <link rel="stylesheet" href="../assets/css/dashboard_alertas.css">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/side_bar.css">

    <script src="../assets/js/sidebar.js" defer></script>
    <script src="../assets/js/permissoes.js" defer></script>
</head>

<body onload="Inicializar(), verificarNivel()">
    <div class="tela_graficos container">
        <div class="navegacao">
            <div class="titulo">
                <img src="../assets/images/logidock_logo.svg" alt="" onclick="window.location.href='../index.html';">
                <span id="empresaUser">empresaUser</span>
            </div>

            <div class="divisor"></div>

            <div class="navegadores">
                <div class="navegador" onclick="window.location.href='bob.html';" id="navegador_bob_ia">
                    <img src="../assets/icons/icone_dashboard.png" alt="">
                    <span>Bob IA</span>
                </div>

                <div class="navegador" onclick="window.location.href='dashboard_graficos.html';" id="navegador_agora">
                    <img src="../assets/icons/icone_dashboard.png" alt="">
                    <span>Dashboard</span>
                </div>

                <div class="navegador navegador_selecionado" onclick="window.location.href='dashboard_alertas.html';" id="navegador_alertas">
                    <img src="../assets/icons/icone_alerta.png" alt="">
                    <span>Alertas</span>
                </div>

                <div class="navegador" onclick="window.location.href='dashboard_docas.html';" id="navegador_docas">
                    <img src="../assets/icons/icone_docas.png" alt="">
                    <span>Docas</span>
                </div>

                <div class="navegador" onclick="window.location.href='dashboard_empresa.html';" id="navegador_empresa">
                    <img src="../assets/icons/icone_empresa.png" alt="">
                    <span>Empresa</span>
                </div>

                <div class="navegador" onclick="window.location.href='dashboard_funcionario.html';" id="navegador_funcionario">
                    <img src="../assets/icons/icone_funcionario.png" alt="">
                    <span>Funcionário</span>
                </div>

                <div class="navegador"
                    onclick="window.location.href = `https://logidock.atlassian.net/servicedesk/customer/portal/1`">
                    <img src="../assets/icons/icone_usuario_help.svg" alt="">
                    <span>Suporte</span>
                </div>
            </div>

            <div class="divisor"></div>

            <div class="info_perfil" onclick="window.location.href='dashboard_user.html'">
                <p id="FakeFoto"></p>
                <div id="nome_permissao">
                    <span id="nome"></span>
                    <span id="permissao"></span>
                </div>
            </div>
        </div>

        <div class="conteudo">
            <div class="Titulo">
                <h1>Histórico Alertas</h1>
                <p id="UltimaAtualizacao">Última atualização: --/--/---- --:--</p>
            </div>
            <div class="TabelaHistorico">
                <div class="AtributosHistorico">
                    <p class="status bolder">STATUS</p>
                    <p class="doca bolder">DOCA</p>
                    <p class="inicio_estadia inicio_estadiaAtributo bolder">INÍCIO ESTADIA</p>
                    <p class="acumulado acumuladoAtributo bolder">ACUMULADO</p>
                </div>
                <div class="ConteudoHistorico" id="ConteudoHistorico"></div>
            </div>
        </div>
    </div>
</body>
<script>
    let fk_empresa = sessionStorage.FK_EMPRESA

    nome.innerHTML = `${sessionStorage.NOME_USUARIO}`;
    empresaUser.innerHTML = `${sessionStorage.RAZAO_SOCIAL}`;
    permissao.innerHTML = `${sessionStorage.NOME_NIVEL_ACESSO}`;

    function Inicializar() {
        fk_empresa = sessionStorage.FK_EMPRESA;
        setTimeout(PegarAvisos, 500);
    }

    function PegarAvisos() {
        fetch(`/empresas/PegarAvisos/${fk_empresa}`)
            .then((resposta) => resposta.json())
            .then((dados) => {
                console.log(dados)
                RenderizarAvisos(dados)
            })
            .catch((erro) => {
                console.error("Erro ao buscar avisos:", erro);
            })

        setTimeout(PegarAvisos, 10000)
    }

    function RenderizarAvisos(dados) {
        ConteudoHistorico.innerHTML = "";
        AtualizarHoraAtual()

        if (dados.length === 0) {
            ConteudoHistorico.innerHTML = "<p style='text-align:center;'>Nenhum alerta no momento.</p>";
            return;
        }

        for (let i = 0; i < dados.length; i++) {
            var horas = Math.floor(dados[i].tempo_acumulado_min / 60);
            var minutos = dados[i].tempo_acumulado_min % 60;

            var corBorda = dados[i].tempo_acumulado_min >= 300 ? "bordaStatusVermelha" : "bordaStatusAmarela";
            var icone = dados[i].tempo_acumulado_min >= 300 ? "alerta_vermelho.svg" : "alerta_amarelo.svg";

            ConteudoHistorico.innerHTML += `
            <div class="BoxHistorico">
                <div class="status ${corBorda}">
                    <img src="../assets/icons/${icone}" alt="">
                </div>
                <p class="doca bolder">${dados[i].numero_doca}</p>
                <p class="inicio_estadia">${FormatarData(dados[i].dt_registro)}</p>
                <p class="acumulado">${horas} hrs ${minutos} min</p>
            </div>
        `;
        }
    }

    function FormatarData(dtRegistro) {
        var data = new Date(dtRegistro);
        var dia = data.toLocaleDateString({ day: "numeric", month: "long" });
        var hora = data.toLocaleTimeString({ hour: "2-digit", minute: "2-digit" });
        return `${dia} | ${hora}`;
    }

    function AtualizarHoraAtual() {
        var agora = new Date();

        var data = agora.toLocaleString({
            day: "2-digit",
            month: "2-digit",
            year: "numeric",
            hour: "2-digit",
            minute: "2-digit",
            seconds: "2-digit"
        });

        UltimaAtualizacao.innerHTML = `Última atualização: ${data}`;
    }
</script>

</html>
