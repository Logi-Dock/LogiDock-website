<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogiDock - Alertas</title>

    <link rel="stylesheet" href="../assets/css/dashboard_alertas.css">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/side_bar.css">
</head>
<body>
    <div class="tela_graficos">
        <div class="navegacao">
            <div class="titulo">
                <img src="../assets/images/logidock_logo.svg" alt="" onclick="window.location.href='../index.html';">
                <span id="empresaUser">empresaUser</span>
            </div>
    
            <div class="divisor"></div>
    
            <div class="navegadores">
                <div class="navegador" onclick="window.location.href='dashboard_graficos.html';">
                    <img src="../assets/icons/icone_dashboard.png" alt="">
                    <span>Dashboard</span>
                </div>
    
                <div class="navegador" onclick="window.location.href='dashboard_alertas.html';" id="navegador_agora">
                    <img src="../assets/icons/icone_alerta.png" alt="">
                    <span>Alertas</span>
                </div>
    
                <div class="navegador" onclick="window.location.href='dashboard_docas.html';">
                    <img src="../assets/icons/icone_docas.png" alt="">
                    <span>Docas</span>
                </div>

                <div class="navegador" onclick="window.location.href='dashboard_empresa.html';">
                    <img src="../assets/icons/icone_empresa.png" alt="">
                    <span>Empresa</span>
                </div>

                <div class="navegador" onclick="window.location.href='dashboard_funcionario.html';">
                    <img src="../assets/icons/icone_funcionario.png" alt="">
                    <span>Funcionário</span>
                </div>
            </div>
    
            <div class="divisor"></div>
    
            <div class="info_perfil" onclick="window.location.href='dashboard_user.html'">
                <img src="../assets/icons/teste_ft_perfil.png" alt="">
                <div id="nome_permissao">
                    <span id="nome">Fernando Brandão</span>
                    <span id="permissao">Administrador</span>
                </div>
            </div>
        </div>
    
        <div class="conteudo">
            <div class="Titulo">
                <h1>Histórico Alertas</h1>
                <p>Última atualização: 20/05/2026 16:30</p>
            </div>
            <div class="TabelaHistorico">
                <div class="AtributosHistorico">
                    <p class="status bolder">STATUS</p>
                    <p class="doca bolder">DOCA</p>
                    <p class="inicio_estadia inicio_estadiaAtributo bolder">INÍCIO ESTADIA</p>
                    <p class="acumulado acumuladoAtributo bolder">ACUMULADO</p>
                </div>
                <div class="ConteudoHistorico">

                    <!-- QUanto mais conteudo, mais pra baixo vai e depois de uns tantos ai ele coloca um scroll top né -->
                    <!-- BoxExemplo de conteudo -->
                    <div class="BoxHistorico">
                        <div class="status bordaStatusVermelha"><img src="../assets/icons/alerta_vermelho.svg" alt=""></div>
                        <p class="doca bolder">D01</p>
                        <p class="inicio_estadia">20 de maio | 16:10</p>
                        <p class="acumulado">4 hrs 39 min</p>
                    </div>
                    <div class="BoxHistorico">
                        <div class="status bordaStatusAmarela"><img src="../assets/icons/alerta_amarelo.svg" alt=""></div>
                        <p class="doca bolder">D01</p>
                        <p class="inicio_estadia">20 de maio | 16:10</p>
                        <p class="acumulado">4 hrs 39 min</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
