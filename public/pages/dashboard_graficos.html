<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogiDock - Gráficos</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="../assets/css/dashboard_grafico.css">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/side_bar.css">
    <link rel="icon" href="../assets/icons/icone_da_pagina.png">

    <script src="../assets/js/dashboard.js" defer></script>
    <script src="../assets/js/sidebar.js" defer></script>
    <script src="../assets/js/permissoes.js" defer></script>
</head>
<div id="toast-container"></div>

<body onload="inicializarDashboard(), verificarNivel()">
    <div class="container">
        <div class="navegacao">
            <div class="titulo">
                <img src="../assets/images/logidock_logo.svg" alt="" onclick="window.location.href='../index.html';">
                <span id="empresaUser">empresaUser</span>
            </div>

            <div class="divisor"></div>

            <div class="navegadores">
                <div class="navegador" onclick="window.location.href='bob.html';" id="navegador_bob_ia">
                    <img src="../assets/icons/icone_dashboard.png" alt="">
                    <span>Bob IA</span>
                </div>

                <div class="navegador navegador_selecionado" onclick="window.location.href='dashboard_graficos.html';"
                    id="navegador_agora">
                    <img src="../assets/icons/icone_dashboard.png" alt="">
                    <span>Dashboard</span>
                </div>

                <div class="navegador" onclick="window.location.href='dashboard_alertas.html';" id="navegador_alertas">
                    <img src="../assets/icons/icone_alerta.png" alt="">
                    <span>Alertas</span>
                </div>

                <div class="navegador" onclick="window.location.href='dashboard_docas.html';" id="navegador_docas">
                    <img src="../assets/icons/icone_docas.png" alt="">
                    <span>Docas</span>
                </div>

                <div class="navegador" onclick="window.location.href='dashboard_empresa.html';" id="navegador_empresa">
                    <img src="../assets/icons/icone_empresa.png" alt="">
                    <span>Empresa</span>
                </div>

                <div class="navegador" onclick="window.location.href='dashboard_funcionario.html';"
                    id="navegador_funcionario">
                    <img src="../assets/icons/icone_funcionario.png" alt="">
                    <span>Funcionário</span>
                </div>

                <div class="navegador"
                    onclick="window.location.href = `https://logidock.atlassian.net/servicedesk/customer/portal/1`">
                    <img src="../assets/icons/icone_usuario_help.svg" alt="">
                    <span>Suporte</span>
                </div>
            </div>

            <div class="divisor"></div>

            <div class="info_perfil" onclick="window.location.href='dashboard_user.html'">
                <p id="FakeFoto"></p>
                <div id="nome_permissao">
                    <span id="nome"></span>
                    <span id="permissao"></span>
                </div>
            </div>
        </div>

        <div class="conteudo">
            <div class="hello">
                <div class="informacoes_hello">
                    <span id="titulo_hello">Olá, <span id="nome_usuario">funcionárioUser!</span></span>

                    <div class="informacoes_hello">
                        <span id="empresaNome">empresa</span>
                        <span id="divisor"> | </span>
                        <span id="data_atual"></span>
                    </div>
                </div>

                <div class="botoes_hello">
                    <button onclick="window.location.href='dashboard_alertas.html'">
                        <a>Alertas</a>
                        <img src="../assets/icons/alerta.png" alt="Ícone de alerta">
                    </button>

                    <div class="filtro-periodo">
                        <select id="periodo" onchange="inicializarDashboard()">
                            <option value="24horas">Últimas 24 horas</option>
                            <option value="7dias">Últimos 7 dias</option>
                            <option value="1mes">Último mês</option>
                            <option value="3meses">Últimos 3 meses</option>
                            <option value="6meses">Últimos 6 meses</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="graficos">

                <div class="kpi">
                    <div class="kpi-item">
                        <span id="kpi-title">Doca com mais atrasos</span>
                        <!-- <span id="kpi_tempo">(3 Meses)</span> -->
                        <div class="kpi-item-content">
                            <p id="ipt_DocaMaisAtrasos"></p>
                            <span id="detalhesKPI1" class='detalhesKPI'></span>
                        </div>


                    </div>

                    <div class="kpi-item">
                        <span id="kpi-title">Doca com maior atraso</span>
                        <!-- <span id="kpi_tempo">(Neste momento)</span> -->
                        <div class="kpi-item-content">
                            <p id="ipt_DocaAtrasoRecente"></p>
                            <span id="detalhesKPI2" class='detalhesKPI'></span>
                        </div>
                    </div>

                    <div class="kpi-item">
                        <span id="kpi-title">Doca com Maior Taxa de Atrasos</span>
                        <!-- <span id="kpi_tempo">(3 Meses)</span> -->
                        <div class="kpi-item-content">
                            <p id="ipt_DocaMaiorPercentual"></p>
                            <span id="detalhesKPI3" class='detalhesKPI'></span>
                        </div>
                    </div>

                    <div class="kpi-item">
                        <span id="kpi-title">Doca com Maior Tempo de Atraso Acumulado</span>
                        <!-- <span id="kpi_tempo">(3 Meses)</span> -->
                        <div class="kpi-item-content">
                            <p id="ipt_DocaMaiorTempo"></p>
                            <span id="detalhesKPI4" class='detalhesKPI'></span />
                        </div>
                    </div>
                </div>

                <div class="container_charts">
                    <div class="top-left">
                        <canvas id="ipt_GraficoBarrasLinhas"></canvas>
                    </div>

                    <div class="top-right">
                        <canvas id="ipt_GraficoPizza"></canvas>
                    </div>

                    <div class="bottom">
                        <canvas id="ipt_GraficoDeGantt"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
<script>
    const TOAST_DURACAO = 6000;
    function fecharToast(el) {
        el.style.animation = 'toastOut .3s ease forwards'
        setTimeout(() => el.remove(), 300)
    }

    function verificarAlertas() {
        fetch(`/empresas/PegarAvisos/${sessionStorage.FK_EMPRESA}`)
            .then(r => r.json())
            .then(dados => {
                const container = document.getElementById('toast-container')
                container.innerHTML = ''

                let ultimo_alerta = dados[0];

                const critico = ultimo_alerta.tempo_acumulado_min*60 >= 20
                const h = Math.floor(ultimo_alerta.tempo_acumulado_min / 60)
                const m = ultimo_alerta.tempo_acumulado_min % 60
                const tipo = critico ? 'toast-critical' : 'toast-warning'
                const msg = critico ? `Doca ${ultimo_alerta.numero_doca} ultrapassou 5h (${h}h ${m}min)` : `Doca ${ultimo_alerta.numero_doca} está há ${h}h ${m}min`
                const toast = document.createElement('div')
                toast.className = `toast ${tipo}`
                toast.innerHTML = `<strong>${msg}</strong><br> <small>Clique para ver alertas</small>`
                toast.onclick = () => window.location.href = 'dashboard_alertas.html'
                container.appendChild(toast)
                setTimeout(() => fecharToast(toast), TOAST_DURACAO)
            })
    }

    function exibirData() {
        var agora = new Date();
        data_atual.innerHTML = `${String(agora.getDate()).padStart(2,'0')}/${String(agora.getMonth() + 1).padStart(2, '0')}/${agora.getFullYear()}`;
    }

    exibirData()
    verificarAlertas()
    setInterval(verificarAlertas, 20000)
</script>

</html>
