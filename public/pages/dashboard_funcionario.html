<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogiDock - Funcionário</title>

    <link rel="stylesheet" href="../assets/css/dashboard_funcionario.css">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/side_bar.css">
</head>
<body>
    <div class="tela_graficos">
        <div class="navegacao">
            <div class="titulo">
                <img src="../assets/images/logidock_logo.svg" alt="" onclick="window.location.href='../index.html';">
                <span id="empresaUser">empresaUser</span>
            </div>
    
            <div class="divisor"></div>
    
            <div class="navegadores">
                <div class="navegador" onclick="window.location.href='dashboard_graficos.html';">
                    <img src="../assets/icons/icone_dashboard.png" alt="">
                    <span>Dashboard</span>
                </div>
    
                <div class="navegador" onclick="window.location.href='dashboard_alertas.html';">
                    <img src="../assets/icons/icone_alerta.png" alt="">
                    <span>Alertas</span>
                </div>
    
                <div class="navegador" onclick="window.location.href='dashboard_docas.html';">
                    <img src="../assets/icons/icone_docas.png" alt="">
                    <span>Docas</span>
                </div>

                <div class="navegador" onclick="window.location.href='dashboard_empresa.html';">
                    <img src="../assets/icons/icone_empresa.png" alt="">
                    <span>Empresa</span>
                </div>

                <div class="navegador" onclick="window.location.href='dashboard_funcionario.html';" id="navegador_agora">
                    <img src="../assets/icons/icone_funcionario.png" alt="">
                    <span>Funcionário</span>
                </div>
            </div>
    
            <div class="divisor"></div>
    
            <div class="info_perfil" onclick="window.location.href='dashboard_user.html'">
                <img src="../assets/icons/teste_ft_perfil.png" alt="">
                <div id="nome_permissao">
                    <span id="nome">Fernando Brandão</span>
                    <span id="permissao">Administrador</span>
                </div>
            </div>
        </div>

        <div class="conteudo">
             <div class="hello">
                <span id="titulo_hello">Cadastrar Funcionário</span></span>
                
                <div class="informacoes_hello">
                    <span id="empresa">Administrar o perfil dos usuários e suas respectivas permissõess</span>
                </div>

                <div class="nome-usuario-card">
                   

                    <div class="cabecalho">
                        <img src="" alt="">
                        <span>Novo Usuário</span>
                    </div>

                    <div class="campos">
                        <div class="linha">
                            <div class="grupo">
                                <label for="nome">Nome Completo</label>
                                <input type="text" id="nome" placeholder="Ex:Nicole">
                            </div>
                            <div class="grupo">
                                <label for="email">E-mail</label>
                                <input type="email" id="email" placeholder="nicole@empresa.com">
                            </div>
                        </div>

                        <div class="linha">
                            <div class="grupo">
                                <label for="senha">Senha Inicial</label>
                                <input type="password" id="senha" placeholder="Mínimo 6 caracteres">
                            </div>
                            
                            <div class="grupo">
                                <label for="nivel">Nível acesso</label>
                                <div class="select">
                                    <select id="nivel">
                                        <option value="">Selecione um nível</option>
                                        <option>Administrador</option>
                                        <option>Gestor</option>
                                        <option>Funcionario</option>
                                    </select>
                                    <span class="arrow">.</span>
                                </div>
                            </div>
                        </div>
                            
                    </div>

                    <div class="acao">
                        <button class="btn-cancelar">Cancelar</button>
                        <button class="btn-salvar">Salvar Cadastro</button>
                    </div>


                </div>

        </div>
    </div>
</body>
</html>
