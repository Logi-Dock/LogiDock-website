<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogiDock - Funcionário</title>

    <link rel="stylesheet" href="../assets/css/dashboard_funcionario.css">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/side_bar.css">

    <script src="../assets/js/dashboard_user.js" defer></script>
    <script src="../assets/js/permissoes.js"></script>
</head>

<body onload="pesquisarUsuario(), totalUsuarios(), verificarNivel()">
    <div class="tela_graficos container">
        <div class="navegacao">
            <div class="titulo">
                <img src="../assets/images/logidock_logo.svg" alt="" onclick="window.location.href='../index.html';">
                <span id="empresaUser">empresaUser</span>
            </div>

            <div class="divisor"></div>

            <div class="navegadores">
                <div class="navegador" onclick="window.location.href='dashboard_graficos.html';">
                    <img src="../assets/icons/icone_dashboard.png" alt="">
                    <span>Dashboard</span>
                </div>

                <div class="navegador" onclick="window.location.href='dashboard_alertas.html';">
                    <img src="../assets/icons/icone_alerta.png" alt="">
                    <span>Alertas</span>
                </div>

                <div class="navegador" onclick="window.location.href='dashboard_docas.html';">
                    <img src="../assets/icons/icone_docas.png" alt="">
                    <span>Docas</span>
                </div>

                <div id="empresa" class="navegador" onclick="window.location.href='dashboard_empresa.html';">
                    <img src="../assets/icons/icone_empresa.png" alt="">
                    <span>Empresa</span>
                </div>

                <div class="navegador" onclick="window.location.href='dashboard_funcionario.html';"
                    id="navegador_agora">
                    <img src="../assets/icons/icone_funcionario.png" alt="">
                    <span>Funcionário</span>
                </div>
                <div class="navegador"
                    onclick="window.location.href = `https://logidock.atlassian.net/servicedesk/customer/portal/1`">
                    <img src="../assets/icons/icone_usuario_help.svg" alt="">
                    <span>Suporte</span>
                </div>
            </div>

            <div class="divisor"></div>

            <div class="info_perfil" onclick="window.location.href='dashboard_user.html'">
                <img src="../assets/icons/teste_ft_perfil.png" alt="">
                <div id="nome_permissao">
                    <span id="nome">Fernando Brandão</span>
                    <span id="permissao">Administrador</span>
                </div>
            </div>
        </div>

        <div class="conteudo">
            <div class="hello">
                <span id="titulo_hello">Cadastrar Funcionário</span></span>

                <div class="informacoes_hello">
                    <span id="empresa">Administrar o perfil dos usuários e suas respectivas permissões</span>
                </div>

                <div class="nome-usuario-card">


                    <div class="cabecalho">
                        <img src="../assets/icons/Icone_pessoa+.png" alt="pessoa">
                        <span>Novo Usuário</span>
                    </div>

                    <div class="campos">
                        <div class="linha">
                            <div class="grupo">
                                <label for="nome">Nome Completo</label>
                                <input type="text" id="nomeUser" placeholder="Ex:Nicole">
                            </div>
                            <div class="grupo">
                                <label for="email">E-mail</label>
                                <input type="email" id="emailUser" placeholder="nicole@empresa.com">
                            </div>
                        </div>

                        <div class="linha">
                            <div class="grupo">
                                <label for="senha">Senha Inicial</label>
                                <input type="password" id="senhaUser" placeholder="Mínimo 6 caracteres">
                            </div>

                            <div class="grupo">
                                <label for="nivel">Nível acesso</label>
                                <div class="select-seta">
                                    <select id="nivelUser">
                                        <option>Selecione um nível</option>
                                        <option value="1">Administrador</option>
                                        <option value="3">Gestor</option>
                                        <option value="2">Funcionario</option>
                                    </select>
                                    <span class="arrow">↓</span>
                                </div>
                            </div>
                        </div>

                    </div>

                    <div class="acao">
                        <button class="btn-cancelar">Cancelar</button>
                        <button onclick="cadastrarUsuario()" class="btn-salvar">Salvar Cadastro</button>
                    </div>
                </div>
            </div>

            <div class="tabela-usuarios">

                <div class="topo">
                    <div class="contadores">
                        <span>Total: <strong id="total">5</strong></span>
                        <span>Administradores: <strong id="adm">1</strong></span>
                        <span>Gestores: <strong id="gestor">3</strong></span>
                        <span>Funcionários: <strong id="func">1</strong></span>
                    </div>
                    <input type="text" class="busca" placeholder="Buscar por nome..." oninput="filtrarUsuarios(this)">
                </div>

                <table class="tabela">
                    <thead>
                        <tr>
                            <th>Usuário</th>
                            <th>Nível de acesso</th>
                            <th>Permissões</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="listaUsuarios">
                    </tbody>
                </table>

            </div>

        </div>
</body>
<script>
    let id_empresa = sessionStorage.FK_EMPRESA
    let usuariosCadastrados = []
    
    function pesquisarUsuario() {
        console.log()
        fetch(`/usuarios/listarUsuarios/${id_empresa}`)
            .then((resposta) => resposta.json())
            .then((usuarios) => {
                usuariosCadastrados = usuarios
                renderizarTabela(usuariosCadastrados)
                //console.log(usuarios)
                //for (let i = 0; i < usuarios.length; i++) {
                //  usuariosCadastrados.push(usuarios[i])
                //}
            })
            .catch((erro) => {
                console.error('Erro ao buscar usuários', erro)
            })
        //.then(() => {

        //  for (let j = 0; j < usuariosCadastrados.length; j++) {
        //    listaUsuarios.innerHTML += `
        //  <tr>
        //    <td>${usuariosCadastrados[j].nome_user}</td>
        //  <td><span class="badge-admin">${usuariosCadastrados[j].nome_nivel_acesso}</span></td>
        //<td>${usuariosCadastrados[j].permissoes}</td>
        //<td><button class="btn-editar">✎</button></td>
        // </tr>
        //  `
        //}
        //})
        //.catch((erro) => {

        //})

    }

    function renderizarTabela(lista) {
        const listaUsuarios = document.getElementById('listaUsuarios')
        listaUsuarios.innerHTML = ''
        for (let i = 0; i < lista.length; i++) {
            listaUsuarios.innerHTML += `
            <tr>
                <td>${lista[i].nome_user}</td>
                <td><span class="badge-admin">${lista[i].nome_nivel_acesso}</span></td>
                <td>${lista[i].permissoes}</td>
                <td><button class="btn-editar">✎</button></td>
            </tr>
            `
        }
        if (lista.length == 0) {
            listaUsuarios.innerHTML = '<tr><td colspan="4" style="text-align:center; color:#888">Nenhum usuário encontrado.</td></tr>'
        }

        function badgeClass(nivel) {
            const map = { 'ADMINISTRADOR': 'badge-admin', 'GESTOR': 'badge-gestor', 'FUNCIONÁRIO': 'badge-func' };
            return map[nivel] || 'badge-func';
        }
        `<span class="badge ${badgeClass(lista[i].nome_nivel_acesso)}"> ${lista[i].nome_nivel_acesso} </span>`
    }

    function filtrarUsuarios(campo) {
        const termo = campo.value.toLowerCase().trim()
        const filtrados = usuariosCadastrados.filter(u =>
            u.nome_user.toLowerCase().includes(termo)
        )
        renderizarTabela(filtrados)
    }

    function cadastrarUsuario() {


        let nomeUsuario = nomeUser.value
        let emailUsuario = emailUser.value
        let senhaUsuario = senhaUser.value
        let nivel = Number(nivelUser.value)

        if (nomeUsuario == '' || emailUsuario == '' || senhaUsuario == '') {
            alert('Preenchimento obrigatório: os campos não podem estar vazios!')
            return
        }



        fetch("/usuarios/CadastrarUsuario", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                nomeServer: nomeUsuario,
                emailServer: emailUsuario,
                senhaServer: senhaUsuario,
                fk_empresaServer: id_empresa,
                fk_nivel_acessoServer: nivel
            })
        }).then(function (resposta) {
            if (resposta.ok) {
                alert('Cadastrado com sucesso!!')
                pesquisarUsuario()
            } else {
                throw 'Teve um erro!!!'
            }

        })
    }

    function totalUsuarios() {
        fetch(`/nivelAcesso/totalUsuarios/${id_empresa}`)
            .then((resposta) => resposta.json())
            .then((usuarios) => {
                console.log(usuarios)
                total.innerHTML = usuarios[0].Total
                adm.innerHTML = usuarios[0].ADMINISTRADORES
                gestor.innerHTML = usuarios[0].GESTORES
                func.innerHTML = usuarios[0].FUNCIONÁRIOS

            })
            .catch((erro) => {
                console.error('Erro ao buscar os Usuarios!!', erro)
            })

    }

    function renderizarTabela(lista) {
        const listaUsuarios = document.getElementById('listaUsuarios')
        listaUsuarios.innerHTML = ''
        for (let i = 0; i < lista.length; i++) {
            listaUsuarios.innerHTML += ` <tr> <td>${lista[i].nome_user}</td> <td><span class="badge ${badgeClass(lista[i].nome_nivel_acesso)}"> 
                ${lista[i].nome_nivel_acesso} </span></td> <td>${lista[i].permissoes}</td> <td> <button onclick="abrirEditar(${lista[i].id_usuario})" class="btn-editar">✎</button> <button onclick="excluirUsuario(${lista[i].id_usuario})" class="btn-excluir">🗑</button> </td> </tr> `
        }
    }

    function badgeClass(nivel) {
        const map = { 'ADMINISTRADOR': 'badge-admin', 'GESTOR': 'badge-gestor', 'FUNCIONÁRIO': 'badge-func' }
        return map[nivel] ?? 'badge-func'
    }

    function excluirUsuario(id) {
        if (confirm('Deseja excluir este usuário?'))
            return fetch(`/usuarios/excluirUsuario/${id}`,
                { method: 'DELETE' })
                .then(function (resposta) {
                    if (resposta.ok) {
                        alert('Usuário excluído com sucesso!')
                        pesquisarUsuario()
                    } else {
                        alert('Erro ao excluir o usuário.')

                    }
                }).catch(function (erro) {
                    console.error('Erro ao excluir usuário', erro)
                })
    }

    function abrirEditar(id) {
        const u = usuariosCadastrados.find(x => x.id_usuario === id)
        document.getElementById('nomeUser').value = u.nome_user
        document.getElementById('emailUser').value = u.email_user
        document.getElementById('nivelUser').value = u.fk_nivel_acesso
        document.querySelector('.btn-salvar').onclick = function () { salvarEdicao(id) }
        document.querySelector('.nome-usuario-card').scrollIntoView({ behavior: 'smooth' })
    }

    function salvarEdicao(id) {
        var nome = document.getElementById('nomeUser').value
        var email = document.getElementById('emailUser').value
        var nivel = Number(document.getElementById('nivelUser').value)
        if (nome == '' || email == '') {
            alert('Nome e e-mail são obrigatórios!')
            return
        }

        fetch(`/usuarios/editarUsuario/${id}`,
            {
                method: 'PUT', headers:
                    { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    nomeServer: nome, emailServer: email, nivelServer: nivel

                })
            }).then(function (resposta) {
                if (resposta.ok) {
                    alert('Usuário atualizado com sucesso!')
                    pesquisarUsuario()
                    document.querySelector('.btn-salvar').onclick = cadastrarUsuario
                } else { alert('Erro ao salvar alterações.') }
            }).catch(function (erro) { console.error('Erro ao editar usuário', erro) })
    }


</script>

</html>
